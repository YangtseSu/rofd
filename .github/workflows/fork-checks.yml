#
# Fork-only CI: the upstream repository's Distribution Builder has every job
# gated behind `if: false` (so nothing is ever built or checked there), and its
# CLA/BUILD gates need a linuxdeepin member. This workflow runs the checks a
# release branch must pass — the ones `debian/rules` builds, the crate test
# suite, rustfmt, clippy and the C ABI runner.
#
# It lives on `dev` only, and every test gates: `dev` is what ships, so it must
# be green on its own base, and upstream `main` is green too, because the two
# tests that used to be red there (fixed by upstream PRs #14 and #15) are merged.
# A `feat/*` or `fix/*` branch carries no copy of this file, so it is checked
# through `workflow_dispatch` with an explicit `refs` list — the same checks —
# and the branch keeps a diff against upstream that contains nothing but the
# change under review.
name: fork checks

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      refs:
        description: 'Space-separated refs to check (default: this branch, then every feat/*, fix/* and dev)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  refs:
    name: collect refs
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: List the branches to check
        id: list
        env:
          DISPATCHED_REFS: ${{ github.event.inputs.refs }}
          PUSHED_REF: ${{ github.ref }}
        run: |
          set -eu
          refs="$DISPATCHED_REFS"
          if [ -z "$refs" ] && [ "$GITHUB_EVENT_NAME" = push ]; then
            refs="$PUSHED_REF"
          fi
          if [ -z "$refs" ]; then
            refs=$(git ls-remote --heads origin |
                     awk '$2 ~ /^refs\/heads\/(feat|fix)\// || $2 == "refs/heads/dev" { print $2 }' |
                     sort)
          fi
          # Every ref is checked the same way: nothing is skipped or tolerated.
          matrix=$(printf '%s\n' $refs |
                     sed 's|^refs/heads/||' |
                     jq -R -s -c 'split("\n") | map(select(length > 0))
                       | map({ref: .})')
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          printf 'checking %s\n' "$matrix"

  checks:
    name: ${{ matrix.entry.ref }}
    needs: refs
    if: needs.refs.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.refs.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.entry.ref }}
          fetch-depth: 0
      - name: Install the build dependencies (debian/control)
        run: |
          sudo apt-get update
          # fonts-noto-cjk and fonts-noto-core are not build dependencies: the crate
          # tests lower the repository's real invoice fixture, whose text names
          # SimSun/KaiTi/Courier New and whose resolver falls back to `Noto Sans CJK SC`
          # and `Noto Sans Mono`, so without them the run reports MissingGlyph
          # diagnostics and `rofd-render --test real_fixture` fails.
          sudo apt-get install -y --no-install-recommends \
            pkg-config libcairo2-dev libfreetype-dev libjbig2dec0-dev \
            qt6-base-dev qt6-declarative-dev \
            fonts-noto-cjk fonts-noto-core
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --offline -p rofd-core -p rofd-render -p rofd-ffi --all-targets -- -D warnings
      - name: crate tests
        run: cargo test --offline -p rofd-core -p rofd-render -p rofd-ffi
      - name: distribution build (what debian/rules runs)
        run: cargo build --release --offline --locked -p rofd-ffi -p rofd --features rofd/qt-reader
      - name: C ABI symbols, header and smoke tests
        run: sh crates/rofd-ffi/tests/run_c_tests.sh
